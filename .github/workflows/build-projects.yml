# Rebuilds the FEATURED_PROJECTS cards and README block whenever projects.md changes,
# so the project list can be edited straight from github.com.
name: Build featured projects

on:
  push:
    paths:
      - projects.md
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: readme-assets # shared with update-stats.yml so the two never push at the same time
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build project cards (light + dark) and README block
        run: python3 scripts/build-projects.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md assets; then
            echo "Projects unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: rebuild featured projects"
          git push
