# Refreshes the GITHUB_STATS window (numbers + contribution grid) in
# assets/bento-bottom.svg and its generated dark twin, then commits if anything changed.
name: Update GitHub stats

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: readme-assets # shared with build-projects.yml so the two never push at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild stats SVG (light + dark)
        env:
          # The built-in token only sees public contributions. To count private
          # commits too, add a personal access token as the repo secret STATS_TOKEN.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python3 scripts/build-stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "Stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh GitHub stats"
          git push
