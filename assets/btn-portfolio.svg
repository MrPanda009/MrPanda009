<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 48" width="100%" height="100%">
  <!-- LET'S_CONNECT button, linked from README.md. No canvas behind it, so it sits on GitHub's page colour.
       Linked buttons: ink drop shadow, chevron and coral underline. Unlinked (portfolio): dashed, muted. -->
  <defs>
    <style>
      /* palette:start */
      :root {
        --bg: #F4EFE6;
        --ink: #181818;
        --accent: #FF4E42;
        --muted: #7A756C;
      }
      /* palette:end */
      .bg { fill: var(--bg); }
      .ink { fill: var(--ink); }
      .coral { fill: var(--accent); }
      .muted { fill: var(--muted); }
      .st-ink { stroke: var(--ink); }
      .st-muted { stroke: var(--muted); }
      .label {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace;
        font-weight: 700;
        font-size: 12.5px;
      }
    </style>
  </defs>
  <rect x="2" y="2" width="166" height="38" rx="3" class="bg st-muted" stroke-width="2" stroke-dasharray="5 4" />
  <g transform="translate(14, 12)"><g transform="translate(9, 9)" fill="none" class="st-muted"><circle cx="0" cy="0" r="8.6" stroke-width="1.8" /><ellipse cx="0" cy="0" rx="4" ry="8.6" stroke-width="1.5" /><line x1="-8" y1="-2.9" x2="8" y2="-2.9" stroke-width="1.4" /><line x1="-8" y1="2.9" x2="8" y2="2.9" stroke-width="1.4" /></g></g>
  <text x="44" y="26" class="label muted">Portfolio (soon)</text>
</svg>
