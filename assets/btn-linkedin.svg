<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 48" width="100%" height="100%">
  <!-- LET'S_CONNECT button, linked from README.md. No canvas behind it, so it sits on GitHub's page colour.
       Linked buttons: ink drop shadow, chevron and coral underline. Unlinked (portfolio): dashed, muted. -->
  <defs>
    <style>
      /* palette:start */
      :root {
        --bg: #F4EFE6;
        --ink: #181818;
        --accent: #FF4E42;
        --muted: #7A756C;
      }
      /* palette:end */
      .bg { fill: var(--bg); }
      .ink { fill: var(--ink); }
      .coral { fill: var(--accent); }
      .muted { fill: var(--muted); }
      .st-ink { stroke: var(--ink); }
      .st-muted { stroke: var(--muted); }
      .label {
        font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace;
        font-weight: 700;
        font-size: 12.5px;
      }
    </style>
  </defs>
  <rect x="6" y="6" width="166" height="38" rx="3" class="ink" />
  <rect x="2" y="2" width="166" height="38" rx="3" class="bg st-ink" stroke-width="2.5" />
  <g transform="translate(14, 12)"><rect x="0" y="0" width="18" height="18" rx="3" class="ink" /><rect x="3.6" y="7" width="2.8" height="8" class="bg" /><circle cx="5" cy="4.4" r="1.6" class="bg" /><path d="M 8.4,7 h 2.6 v 1.1 c 0.6,-0.9 1.5,-1.3 2.6,-1.3 c 1.9,0 2.8,1.2 2.8,3.3 V 15 h -2.7 v -4.4 c 0,-1 -0.4,-1.5 -1.2,-1.5 c -0.9,0 -1.4,0.6 -1.4,1.7 V 15 h -2.7 Z" class="bg" /></g>
  <text x="44" y="26" class="label ink">LinkedIn</text>
  <polyline points="149,15 155,21 149,27" fill="none" class="st-ink" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="44" y="30" width="16" height="2" class="coral" shape-rendering="crispEdges" />
</svg>
